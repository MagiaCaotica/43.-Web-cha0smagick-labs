name: Bot Deploy

on:
  push:
    branches: ["main"]
  workflow_dispatch:

# Secrets requeridos (configurar en GitHub Settings > Secrets and variables > Actions):
# SSH_HOST          - Host/IP del servidor (ej: "192.168.1.100" o "miservidor.com")
# SSH_USER          - Usuario SSH (ej: "ubuntu", "root", "deploy")
# SSH_KEY           - Clave privada SSH (contenido completo de id_rsa, incluyendo headers)
#
# Secrets opcionales (con valores por defecto):
# BOT_PATH          - Ruta absoluta al proyecto en el servidor (default: "/opt/cha0smagick-labs")
# PM2_APP_NAME      - Nombre de la app en PM2 (default: "cha0smagick-bots")
# NODE_VERSION      - Versión de Node en el servidor (default: "22")
# TELEGRAM_BOT_TOKEN- Token del bot de Telegram (para verificar que responde)

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check deploy secrets
        id: check
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
          BOT_HOST: ${{ secrets.BOT_HOST }}
          BOT_USER: ${{ secrets.BOT_USER }}
          BOT_SSH_KEY: ${{ secrets.BOT_SSH_KEY }}
        run: |
          # docs/bot-deployment.md documenta BOT_HOST/BOT_USER/BOT_SSH_KEY y el
          # workflow usaba SSH_HOST/SSH_USER/SSH_KEY. Se aceptan los dos nombres
          # para que el secret que ya exista funcione.
          HOST="${SSH_HOST:-$BOT_HOST}"
          USER="${SSH_USER:-$BOT_USER}"
          KEY="${SSH_KEY:-$BOT_SSH_KEY}"
          if [ -z "$HOST" ] || [ -z "$USER" ] || [ -z "$KEY" ]; then
            # Sin secrets el deploy por CI no puede hacerse. No es un fallo del
            # codigo: los bots siguen corriendo en el servidor con el ultimo
            # deploy manual. Se avisa y el job termina en verde.
            echo "::warning::Deploy por CI deshabilitado: faltan los secrets de servidor (SSH_HOST/BOT_HOST, SSH_USER/BOT_USER, SSH_KEY/BOT_SSH_KEY)."
            echo "::warning::Crea en Settings > Secrets and variables > Actions > Repository secrets y re-ejecuta este workflow."
            echo "::warning::Los bots NO se tocan: siguen corriendo en el servidor con el codigo del ultimo deploy manual."
            echo "DEPLOY=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Secrets de deploy presentes: $USER@$HOST"
          echo "DEPLOY=true" >> "$GITHUB_OUTPUT"
          {
            echo "HOST=$HOST"
            echo "USER=$USER"
            echo "KEY<<__EOF__"
            echo "$KEY"
            echo "__EOF__"
          } >> "$GITHUB_ENV"

      # Sin esto el job salia en verde con "Deploy via SSH: skipped" y nadie
      # se enteraba de que el bot llevaba dias sin desplegarse. Aqui se comprueba
      # que el token de Telegram responde; si esta caducado o mal copiado, el
      # bot esta muerto aunque PM2 diga "online".
      - name: Verify Telegram bot token
        id: verify
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ]; then
            echo "::warning::TELEGRAM_BOT_TOKEN no configurado: no se puede verificar el bot desde CI."
            echo "TOKEN_OK=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          code=$(curl -sS -o /tmp/getme.json -w '%{http_code}' --max-time 20 \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/getMe" || echo 000)
          if [ "$code" != "200" ]; then
            echo "::error::El token de Telegram no responde (HTTP $code). El bot NO esta operativo."
            head -c 400 /tmp/getme.json || true
            echo ""
            echo "TOKEN_OK=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          echo "::notice::Telegram OK: $(grep -o '"username":"[^"]*"' /tmp/getme.json | head -1)"
          echo "TOKEN_OK=true" >> "$GITHUB_OUTPUT"

      - name: Deploy via SSH
        if: steps.check.outputs.DEPLOY == 'true'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ env.HOST }}
          username: ${{ env.USER }}
          key: ${{ env.KEY }}
          port: 22
          script: |
            set -e
            BOT_PATH="${{ secrets.BOT_PATH || '/opt/cha0smagick-labs' }}"
            PM2_APP_NAME="${{ secrets.PM2_APP_NAME || 'cha0smagick-bots' }}"
            NODE_VERSION="${{ secrets.NODE_VERSION || '22' }}"

            echo "=== Desplegando bots en $BOT_PATH ==="
            cd "$BOT_PATH"

            # Actualizar código
            git fetch origin
            git reset --hard origin/main

            # Instalar dependencias de producción
            npm ci --omit=dev

            # Recargar PM2 (o iniciar si no existe)
            if pm2 list | grep -q "$PM2_APP_NAME"; then
              echo "Recargando $PM2_APP_NAME con PM2..."
              pm2 reload "$PM2_APP_NAME" --update-env
            else
              echo "Iniciando $PM2_APP_NAME con PM2..."
              pm2 start scripts/bots/run-bots.js --name "$PM2_APP_NAME" -- all
            fi

            # Guardar configuración PM2
            pm2 save

            echo "=== Despliegue completado ==="
            pm2 status "$PM2_APP_NAME"

      # El deploy puede "completarse" y dejar el bot caido (token caducado,
      # .env ausente, dependencia que no compila). Esto verifica que hay al
      # menos un proceso PM2 online y que el token del servidor responde.
      - name: Post-deploy health check
        if: steps.check.outputs.DEPLOY == 'true'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ env.HOST }}
          username: ${{ env.USER }}
          key: ${{ env.KEY }}
          port: 22
          script: |
            set -e
            BOT_PATH="${{ secrets.BOT_PATH || '/opt/cha0smagick-labs' }}"
            cd "$BOT_PATH"
            pm2 status

            ONLINE=$(pm2 jlist | node -e '
              let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{
                try{const p=JSON.parse(s);console.log(p.filter(x=>x.pm2_env&&x.pm2_env.status==="online").length)}catch(e){console.log(0)}})')
            if [ "${ONLINE:-0}" -lt 1 ]; then
              echo "::error::Ningun proceso PM2 quedo online tras el deploy. El bot esta caido."
              pm2 logs --lines 40 --nostream || true
              exit 1
            fi
            echo "::notice::Procesos PM2 online: $ONLINE"

            if [ -f .env ] && grep -q '^TELEGRAM_BOT_TOKEN=' .env; then
              set -a; . ./.env; set +a
              CODE=$(curl -sS -o /tmp/getme.json -w '%{http_code}' --max-time 20 \
                "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/getMe" || echo 000)
              if [ "$CODE" != "200" ]; then
                echo "::error::El token de Telegram del servidor no responde (HTTP $CODE)."
                head -c 400 /tmp/getme.json || true
                exit 1
              fi
              echo "::notice::Telegram responde desde el servidor: $(grep -o '"username":"[^"]*"' /tmp/getme.json | head -1)"
            else
              echo "::warning::No se encontro TELEGRAM_BOT_TOKEN en el .env del servidor: no se pudo verificar Telegram."
            fi

      - name: Resumen
        if: always()
        env:
          DEPLOYED: ${{ steps.check.outputs.DEPLOY }}
          TOKEN_OK: ${{ steps.verify.outputs.TOKEN_OK }}
        run: |
          {
            echo "### Bot Deploy"
            echo ""
            echo "- Deploy por SSH: $([ "$DEPLOYED" = "true" ] && echo 'ejecutado' || echo 'OMITIDO - faltan los secrets SSH')"
            echo "- Token de Telegram: $([ "$TOKEN_OK" = "true" ] && echo 'valido' || echo 'no verificado')"
            echo ""
            if [ "$DEPLOYED" != "true" ]; then
              echo "El job esta en verde pero NO se desplego nada. Configura SSH_HOST/SSH_USER/SSH_KEY (o BOT_HOST/BOT_USER/BOT_SSH_KEY) en los secrets del repo."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
