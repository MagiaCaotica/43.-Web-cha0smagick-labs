name: Pins Hourly

on:
  schedule:
    - cron: '0 11-12,14-22 * * *'
  workflow_dispatch:
    inputs:
      slot:
        description: 'Slot manual 0-10 (vacio = usar la hora UTC del cron)'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: pins-hourly-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Publish scheduled pin
        env:
          PINTEREST_TOKEN: ${{ secrets.PINTEREST_TOKEN }}
          PINTEREST_BOARD_ID: ${{ secrets.PINTEREST_BOARD_ID }}
          PINTEREST_API_BASE: ${{ vars.PINTEREST_API_BASE }}
          PIN_SLOT: ${{ github.event.inputs.slot }}
        run: node scripts/pin-hourly.mjs

      - name: Commit published markers
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # pins/output/daily esta versionado, asi que 'git add' a pelo funciona.
          # No usar --ignore-unmatch: esa opcion NO existe en git add
          # ("unknown option", exit 129) y tumbaba el job cada hora.
          git add pins/output/daily
          git diff --staged --quiet || git commit -m 'pins: published marker'
          # Reintento: si otro push entra entre el commit y el push, el rebase y
          # el push se pelean y el job cae en rojo sin motivo aparente.
          for i in 1 2 3; do
            if git pull --rebase origin main && git push; then
              echo "Marcadores guardados."
              exit 0
            fi
            git rebase --abort || true
            sleep 10
          done
          echo "::warning::No se pudieron guardar los marcadores tras 3 intentos."