name: Social Daily (Telegram + 1 pin)

on:
  schedule:
    - cron: '0 13 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: social-daily
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Publish daily social content
        env:
          SOCIAL_ONESHOT: '1'
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL: ${{ secrets.TELEGRAM_CHANNEL }}
          PINTEREST_TOKEN: ${{ secrets.PINTEREST_TOKEN }}
          PINTEREST_BOARD_ID: ${{ secrets.PINTEREST_BOARD_ID }}
          POST_BRIDGE_KEY: ${{ secrets.POST_BRIDGE_KEY }}
          POST_BRIDGE_URL: ${{ secrets.POST_BRIDGE_URL }}
        run: node scripts/social-publish.js daily

      - name: Commit state
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # data/social-state.json esta versionado, asi que 'git add' a pelo
          # funciona. No usar --ignore-unmatch: esa opcion NO existe en git add
          # ("unknown option"), y hacia caer el job con exit 129.
          # 'git add -A -- <fichero>' sobre un pathspec inexistente muere con
          # "fatal: pathspec ... did not match any files" (exit 128) y tumbaba
          # el job entero. Por eso se asegura el fichero antes y se protege el add.
          mkdir -p data
          [ -f data/social-state.json ] || echo '{}' > data/social-state.json
          git add -A -- data/social-state.json || true
          git diff --staged --quiet || git commit -m 'social: daily state'
          # Reintento: si otro push entra entre el commit y el push, el rebase y
          # el push se pelean y el job cae en rojo sin motivo aparente.
          for i in 1 2 3; do
            if git pull --rebase origin main && git push; then
              echo "Estado guardado."
              exit 0
            fi
            git rebase --abort || true
            sleep 10
          done
          echo "::warning::No se pudo guardar el estado tras 3 intentos."