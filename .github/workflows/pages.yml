name: Deploy to GitHub Pages

on:
  # Manual a proposito: hoy Pages esta en build_type=legacy (publica la rama main
  # tal cual) y este workflow NO puede desplegar mientras no se migre a
  # build_type=workflow. Ademas su lista de rsync excluye /pins/, /projects/,
  # /scripts/, /docs/ y /logs/, rutas que la web referencia: desplegarlo ahora
  # dejaria la web sin esas imagenes y paginas.
  # Para activarlo: Settings > Pages > Source = "GitHub Actions", quitar de
  # --exclude las rutas que la web use, y restoring el trigger de push.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Build JS + CSS (plan 3.2.1)
        run: |
          npm ci
          npm run build:js
          npm run build:css
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: "Prepare clean artifact (F-22: excluye tooling, secretos y junk)"
        run: |
          mkdir -p /tmp/site
          rsync -a \
            --exclude '.git' \
            --exclude 'node_modules' \
            --exclude 'docs' \
            --exclude 'logs' \
            --exclude 'scripts' \
            --exclude 'deploy' \
            --exclude 'projects' \
            --exclude 'undefined' \
            --exclude 'tools/auto-shorts' \
            --exclude 'telegram-bot' \
            --exclude 'webhooks' \
            --exclude 'email-sequences' \
            --exclude 'content-calendar' \
            --exclude 'kpi-dashboard' \
            --exclude 'pins' \
            --exclude 'submissions' \
            --exclude '.gsc*' \
            --exclude '.env*' \
            --exclude '.vscode' \
            --exclude 'package.json' \
            --exclude 'package-lock.json' \
            --exclude 'vitest.config.*' \
            --exclude 'pytest.ini' \
            --exclude 'AUDITORIA-*' \
            --exclude 'PLAN-*' \
            ./ /tmp/site/
          echo "artifact files: $(find /tmp/site -type f | wc -l)"
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: /tmp/site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
