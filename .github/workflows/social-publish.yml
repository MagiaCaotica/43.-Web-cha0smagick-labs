name: Social Publish Daily

# MASTER_EXECUTION_PLAN 3.3.1 — cron diario de publicación social
# (Pinterest + X/Twitter + Telegram channel) con persistencia de state.
# 08:00 America/Bogota = 13:00 UTC.

on:
  schedule:
    - cron: '0 13 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Publish daily social content
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN || '' }}
          TELEGRAM_CHANNEL: ${{ secrets.TELEGRAM_CHANNEL || '' }}
          PINTEREST_TOKEN: ${{ secrets.PINTEREST_TOKEN || '' }}
          PINTEREST_BOARD_ID: ${{ secrets.PINTEREST_BOARD_ID || '' }}
          POST_BRIDGE_KEY: ${{ secrets.POST_BRIDGE_KEY || '' }}
          POST_BRIDGE_URL: ${{ secrets.POST_BRIDGE_URL || '' }}
        run: node scripts/social-publish.js daily

      - name: Commit state if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/social-state.json
          git diff --cached --quiet || git commit -m "[3.3.1] update social publishing state"
          git push
