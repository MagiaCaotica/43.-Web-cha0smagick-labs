<style>:root{--bg:#0a0a12;--card:#141424;--amber:#ffb03a;--cyan:#35c4d9;--txt:#e8e8f4;--mut:#9aa0c0;--bd:#2a2a44}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font:16px/1.7 'Helvetica Neue',Arial,sans-serif}
.wrap{max-width:760px;margin:0 auto;padding:0 20px}
.hero{background:linear-gradient(135deg,#0f0f1e,#1a1a30);border-bottom:2px solid var(--amber);padding:40px 0 28px;text-align:center}
h1{font-size:30px;margin:0 0 8px}
.lede{color:var(--mut);margin:0}
.searchbox{margin:22px auto 0;max-width:560px}
.searchbox input{width:100%;background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:14px 18px;color:var(--txt);font-size:17px;outline:none}
.searchbox input:focus{border-color:var(--cyan)}
#search-count{color:var(--mut);font-size:14px;margin:14px 0 0}
main{padding:24px 0 48px}
.result{display:block;background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:14px 16px;margin:10px 0;text-decoration:none;color:var(--txt)}
.result:hover{border-color:var(--amber)}
.result b{color:var(--amber)}
.result p{margin:6px 0 0;color:var(--mut);font-size:14px}
.badge{display:inline-block;background:#1c1408;border:1px solid var(--cyan);color:var(--cyan);border-radius:12px;padding:1px 10px;font-size:12px;margin-left:8px;vertical-align:middle}
footer{border-top:1px solid var(--bd);padding:24px 0 40px;color:var(--mut);font-size:14px}
footer a{margin-right:14px}</style>
</head>
<body>
<div class="hero"><div class="wrap">
<h1>🔍 Buscador del sitio</h1>
<p class="lede">Busca en las 900+ páginas: guías, herramientas, apps y libros.</p>
<div class="searchbox"><input type="search" id="search-input" placeholder="sigilos, runas, tarot, I Ching, sueño lúcido…" autofocus aria-label="Buscar"></div>

</div></div>
<main class="wrap"><div id="search-results"></div></main>
