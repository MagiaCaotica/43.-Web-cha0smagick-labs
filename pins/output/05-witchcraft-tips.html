<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pinterest Pin Template - Cha0smagick LABS</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  
  body {
    width: 1000px;
    height: 1500px;
    overflow: hidden;
    font-family: 'Georgia', 'Times New Roman', serif;
  }

  .pin {
    width: 1000px;
    height: 1500px;
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 60px 50px;
    text-align: center;
  }

  /* Background styles */
  .bg-dark-purple { 
    background: linear-gradient(135deg, #0a0015 0%, #1a0025 30%, #2d0040 60%, #0a0015 100%);
  }
  .bg-black-gold { 
    background: linear-gradient(135deg, #000000 0%, #1a1200 40%, #2a1a00 70%, #000000 100%);
  }
  .bg-deep-red { 
    background: linear-gradient(135deg, #1a0000 0%, #2d0000 30%, #400000 60%, #1a0000 100%);
  }
  .bg-midnight-blue { 
    background: linear-gradient(135deg, #000814 0%, #001233 30%, #002855 60%, #000814 100%);
  }
  .bg-forest-dark { 
    background: linear-gradient(135deg, #001a08 0%, #002d12 30%, #00401a 60%, #001a08 100%);
  }

  /* Decorative elements */
  .pin::before {
    content: '';
    position: absolute;
    top: 30px;
    left: 30px;
    right: 30px;
    bottom: 30px;
    border: 1px solid rgba(255, 215, 0, 0.15);
    border-radius: 8px;
    pointer-events: none;
  }
  .pin::after {
    content: '';
    position: absolute;
    top: 45px;
    left: 45px;
    right: 45px;
    bottom: 45px;
    border: 1px solid rgba(255, 215, 0, 0.06);
    border-radius: 4px;
    pointer-events: none;
  }

  .icon {
    font-size: 72px;
    margin-bottom: 30px;
    text-shadow: 0 0 40px rgba(255, 215, 0, 0.3);
  }

  .category-label {
    font-family: 'Arial', sans-serif;
    font-size: 13px;
    letter-spacing: 4px;
    text-transform: uppercase;
    margin-bottom: 25px;
    padding: 8px 20px;
    border: 1px solid;
    border-radius: 2px;
  }

  .text-gold { color: #d4a843; }
  .text-purple { color: #b388ff; }
  .text-white { color: #f0e6d0; }
  .text-red { color: #ff6b6b; }
  .text-blue { color: #64b5f6; }
  .text-green { color: #81c784; }
  .border-gold { border-color: #d4a843; }
  .border-purple { border-color: #b388ff; }
  .border-red { border-color: #ff6b6b; }
  .border-blue { border-color: #64b5f6; }
  .border-green { border-color: #81c784; }

  .title {
    font-size: 42px;
    font-weight: bold;
    line-height: 1.2;
    margin-bottom: 20px;
    color: #f0e6d0;
  }
  
  .title-glow { text-shadow: 0 0 30px rgba(212, 168, 67, 0.15); }

  .subtitle {
    font-size: 20px;
    line-height: 1.5;
    color: rgba(240, 230, 208, 0.7);
    max-width: 700px;
    font-weight: normal;
    margin-bottom: 40px;
  }

  .cta-button {
    font-family: 'Arial', sans-serif;
    font-size: 16px;
    letter-spacing: 3px;
    text-transform: uppercase;
    padding: 18px 45px;
    border: none;
    border-radius: 2px;
    cursor: pointer;
    font-weight: bold;
    transition: transform 0.2s;
  }

  .btn-gold { background: #d4a843; color: #0a0015; }
  .btn-purple { background: #7c4dff; color: #f0e6d0; }
  .btn-red { background: #d32f2f; color: #f0e6d0; }
  .btn-blue { background: #1565c0; color: #f0e6d0; }
  .btn-green { background: #2e7d32; color: #f0e6d0; }

  .brand {
    position: absolute;
    bottom: 50px;
    font-size: 11px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: rgba(240, 230, 208, 0.3);
    font-family: 'Arial', sans-serif;
  }

  /* Decorative lines */
  .decor-line {
    width: 60px;
    height: 1px;
    background: linear-gradient(90deg, transparent, #d4a843, transparent);
    margin-bottom: 25px;
  }

  /* Star/ornament decorations */
  .star {
    position: absolute;
    color: rgba(255, 215, 0, 0.08);
    font-size: 120px;
  }

  .star-tl { top: 60px; left: 60px; }
  .star-br { bottom: 80px; right: 60px; }

  /* Decorative border corners */
  .corner {
    position: absolute;
    width: 30px;
    height: 30px;
    border-color: rgba(212, 168, 67, 0.2);
  }
  .corner-tl { top: 40px; left: 40px; border-top: 1px solid; border-left: 1px solid; }
  .corner-tr { top: 40px; right: 40px; border-top: 1px solid; border-right: 1px solid; }
  .corner-bl { bottom: 40px; left: 40px; border-bottom: 1px solid; border-left: 1px solid; }
  .corner-br { bottom: 40px; right: 40px; border-bottom: 1px solid; border-right: 1px solid; }

  /* Divider */
  .divider {
    display: flex;
    align-items: center;
    gap: 15px;
    margin-bottom: 20px;
    width: 300px;
  }
  .divider-line {
    flex: 1;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(212, 168, 67, 0.3), transparent);
  }
  .divider-dot {
    width: 4px;
    height: 4px;
    background: #d4a843;
    border-radius: 50%;
    opacity: 0.5;
  }
</style>
</head>
<body>
<div class="pin bg-forest-dark">
  <div class="star star-tl">✦</div>
  <div class="star star-br">✦</div>
  <div class="corner corner-tl"></div>
  <div class="corner corner-tr"></div>
  <div class="corner corner-bl"></div>
  <div class="corner corner-br"></div>

  <div class="icon">🧙</div>
  <div class="category-label text-green border-green">Witchcraft</div>
  <div class="decor-line"></div>
  <div class="title title-glow">Beginner Witch? Start Here.</div>
  <div class="subtitle">5 simple spells, 6 types of witchcraft, and a 6-minute daily practice routine. No experience needed.</div>
  
  <div class="divider">
    <div class="divider-line"></div>
    <div class="divider-dot"></div>
    <div class="divider-line"></div>
  </div>

  <div class="cta-button btn-green">Read the Guide →</div>
  <div class="brand">Cha0smagick LABS</div>
</div>
</body>
</html>
